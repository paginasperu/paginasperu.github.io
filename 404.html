<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon-oficial.svg">
    <link rel="apple-touch-icon" href="/assets/img/icon-oficial-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
      (function() {
        const links = {
            "whatsapp": "https://wa.me/51950141414",
            "instagram": "https://www.instagram.com/oficial.pe_",
            "facebook": "https://www.facebook.com/oficialperu",
            "tiktok": "https://www.tiktok.com/@oficial.pe_",
            "youtube": "https://www.youtube.com/@oficial.pe_tv",
            "mapa": "https://maps.app.goo.gl/64j7gMR3SiLfdUu46"
        };

        const slug = window.location.pathname.replace(/^\/+|\/+$/g, "");

        // GitHub Pages also sends clean page routes here because it serves static files only.
        const pages = {
            "contacto": "/contacto.html",
            "privacidad": "/privacidad.html",
            "registro": "/registro.html"
        };

        if (pages[slug]) {
            window.location.replace(pages[slug] + window.location.search + window.location.hash);
            return;
        }
        
        // Si el slug existe en nuestra lista, redirigimos de inmediato
        if (links[slug]) {
            window.location.replace(links[slug]);
            // Guardamos en una variable global que estamos redirigiendo para el CSS
            window.isRedirecting = true;
        }
      })();
    </script>

    <title>OFICIAL</title>
    <meta name="description" content="Si es oficial.pe, es oficial. Plataforma de validación digital para marcas peruanas.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="oficial.pe">
    <meta property="og:title" content="oficial.pe">
    <meta property="og:description" content="Si es oficial.pe, es oficial">
    <meta property="og:url" content="https://www.oficial.pe/">
    <meta property="og:image" content="https://www.oficial.pe/assets/img/og-image-oficial-si-es.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1672">
    <meta property="og:image:height" content="941">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="oficial.pe">
    <meta name="twitter:description" content="Si es oficial.pe, es oficial">
    <meta name="twitter:image" content="https://www.oficial.pe/assets/img/og-image-oficial-si-es.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9F9F7;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 600px; opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
        h1 { font-size: 2.2rem; font-weight: 300; margin-bottom: 20px; letter-spacing: -1px; }
        p { color: #666; margin-bottom: 40px; font-size: 1.1rem; }
        .cta-button {
            display: inline-block;
            text-decoration: none;
            color: #333;
            border: 1px solid #ccc;
            padding: 12px 30px;
            border-radius: 50px;
            transition: 0.2s;
        }
        .cta-button:hover { background: #111; color: #fff; border-color: #111; }
        @keyframes fadeIn { to { opacity: 1; } }

        .error-brand { display: block; width: 84px; height: auto; margin: 0 auto 18px; }

        /* Si estamos redirigiendo, ocultamos el mensaje de error por defecto */
        .is-error { display: block; }
        .is-redirecting { display: none; }
    </style>
</head>
<body>

    <main id="redirect-ui" class="container" style="display: none;">
        <h1>Conectando...</h1>
        <p>Te estamos llevando al enlace oficial de OFICIAL.PE</p>
    </main>

    <main id="error-ui" class="container">
        <img class="error-brand" src="/assets/img/logo-oficial-claro.svg" alt="oficial.pe" width="84" height="24">
        <span style="color:#999; font-weight:500; font-size:0.9rem; display:block; margin-bottom:10px;">ERROR 404</span>
        <h1>Enlace no oficial</h1>
        <p>Esta dirección no existe o ya no está disponible.</p>
        <a href="https://www.oficial.pe" class="cta-button">Ir al inicio</a>
    </main>

    <script>
        // Si el script inicial detectó un slug válido, cambiamos la UI
        if (window.isRedirecting) {
            document.getElementById('error-ui').style.display = 'none';
            document.getElementById('redirect-ui').style.display = 'block';
        }
    </script>
</body>
</html>
